<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TasknBoard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, system-ui, sans-serif;
        background: #111214;
        color: #e8e9eb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        box-sizing: border-box;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #1b1d20;
        border: 1px solid #2b2d32;
        border-radius: 8px;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
        color: #a9abb0;
        font-size: 15px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 17px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2b2d32;
        background: #111214;
        color: inherit;
      }
      button {
        margin-top: 16px;
        width: 100%;
        font: inherit;
        font-weight: 600;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #9de3c1;
        color: #102b20;
      }
      button:disabled {
        opacity: 0.6;
      }
      #message {
        margin: 12px 0 0;
        min-height: 1.4em;
      }
      #message.error {
        color: #f2a7a7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to your workspace</h1>
      <p>Enter the address of your team's TasknBoard server.</p>
      <form id="form" hidden>
        <label for="server">Server address</label>
        <input
          id="server"
          type="url"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://tasks.example.com"
          required
        />
        <button id="connect">Connect</button>
      </form>
      <p id="message" role="status"></p>
    </main>
    <script type="module">
      const { invoke } = window.__TAURI__.core;
      const form = document.getElementById("form");
      const input = document.getElementById("server");
      const button = document.getElementById("connect");
      const message = document.getElementById("message");

      function show(text, error = false) {
        message.textContent = text;
        message.className = error ? "error" : "";
        message.setAttribute("role", error ? "alert" : "status");
      }

      // An opaque response proves that DNS, TLS, and the server respond.
      async function open(url) {
        show(`Connecting to ${url}…`);
        try {
          await fetch(url, {
            mode: "no-cors",
            cache: "no-store",
            signal: AbortSignal.timeout(10000),
          });
        } catch {
          throw new Error(
            `Can't reach ${url}. Check the address and your network.`,
          );
        }
        location.replace(url);
      }

      async function connect() {
        button.disabled = true;
        try {
          await open(await invoke("save_server", { url: input.value }));
        } catch (error) {
          show(error instanceof Error ? error.message : String(error), true);
          button.disabled = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        void connect();
      });

      const saved = await invoke("saved_server");
      input.value = saved ?? "";
      if (saved && !new URLSearchParams(location.search).has("change")) {
        try {
          await open(saved);
        } catch (error) {
          show(error.message, true);
          form.hidden = false;
        }
      } else {
        form.hidden = false;
        input.focus();
      }
    </script>
  </body>
</html>
