[package]
name = "tasknboard"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"
dunce = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep procedural-macro dylibs loadable with the macOS 27 toolchain.
# https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"
