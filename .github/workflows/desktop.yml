name: Desktop apps

# Builds the Windows installer and the macOS app. A push to main also
# publishes both, and the signed update feed, to the `latest` release.
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-build']
    paths-ignore: ['**/*.md']

# A running build always finishes, and only the newest waiting push runs after it.
# Runs finish in push order, so `latest` never goes back in time.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TASKNBOARD_GITHUB_CLIENT_ID: ${{ vars.TASKNBOARD_GITHUB_CLIENT_ID }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TASKNBOARD_VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Check the GitHub OAuth client ID
        if: env.TASKNBOARD_GITHUB_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::error::Missing repository variable TASKNBOARD_GITHUB_CLIENT_ID. Register a GitHub OAuth app with Device Flow enabled."
          exit 1
      - name: Check the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY. See the Automatic updates section in README.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/tauri.conf.json', 'src-tauri/tauri.windows.conf.json') }}
          restore-keys: |
            windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-rust-
      # PowerShell keeps the Windows tar.exe that desktop:prepare needs; Git Bash puts GNU tar first.
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'release.conf.json'
          @{ version = $env:TASKNBOARD_VERSION; bundle = @{ createUpdaterArtifacts = $true } } |
            ConvertTo-Json -Compress | Set-Content -Path $config -Encoding utf8NoBOM
          # A restored cache can hold installers from earlier versions.
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          # PowerShell removes a bare -- before it runs the npm.ps1 shim.
          npm run desktop:build:windows '--' --config $config
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test bundled service
        shell: pwsh
        run: |
          $env:TASKNBOARD_TEST_NODE = Join-Path $PWD 'src-tauri/resources/node.exe'
          $env:TASKNBOARD_TEST_SERVICE = Join-Path $PWD 'src-tauri/resources/server.mjs'
          node --test tests/desktop.test.mjs
      - name: Find the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: windows-playwright-${{ steps.playwright.outputs.version }}
      - name: Test browser workflows
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install and launch the app
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TasknBoard-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TASKNBOARD_VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Check the GitHub OAuth client ID
        if: env.TASKNBOARD_GITHUB_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::error::Missing repository variable TASKNBOARD_GITHUB_CLIENT_ID. Register a GitHub OAuth app with Device Flow enabled."
          exit 1
      - name: Check the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY. See the Automatic updates section in README.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: macos-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/tauri.conf.json') }}
          restore-keys: |
            macos-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            macos-rust-
      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          echo "{\"version\":\"$TASKNBOARD_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}" > "$RUNNER_TEMP/release.conf.json"
          # A restored cache can hold bundles from earlier versions.
          rm -rf src-tauri/target/release/bundle
          npm run desktop:build -- --config "$RUNNER_TEMP/release.conf.json"
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test bundled service
        run: |
          TASKNBOARD_TEST_NODE="$PWD/src-tauri/resources/node" \
          TASKNBOARD_TEST_SERVICE="$PWD/src-tauri/resources/server.mjs" \
          node --test tests/desktop.test.mjs
      # ditto keeps the bundle's symlinks and ad-hoc signature intact.
      # The updater installs the signed .app.tar.gz archive.
      - name: Zip the app
        run: |
          bundle=src-tauri/target/release/bundle/macos
          codesign --verify --deep --strict "$bundle/TasknBoard.app"
          mkdir macos-release
          ditto -c -k --sequesterRsrc --keepParent "$bundle/TasknBoard.app" macos-release/TasknBoard-macos-arm64.zip
          cp "$bundle/TasknBoard.app.tar.gz" macos-release/TasknBoard-macos-arm64.app.tar.gz
          cp "$bundle/TasknBoard.app.tar.gz.sig" macos-release/TasknBoard-macos-arm64.app.tar.gz.sig
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TasknBoard-macos-arm64
          path: macos-release/
          if-no-files-found: error
          retention-days: 30

  # Each platform is optional: the release publishes whichever builds succeeded,
  # so one broken platform does not hold back updates for the other.
  release:
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.windows.result == 'success' || needs.macos.result == 'success')
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      TASKNBOARD_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download builds
        run: gh run download "$GITHUB_RUN_ID" --dir builds
      # Fixed names keep the releases/latest/download/<name> links stable.
      # A platform that failed keeps its previous files on the release and is left
      # out of the feed, so its installed apps are not offered this version.
      - name: Name release files
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          mkdir release
          base="https://github.com/$GH_REPO/releases/download/latest"
          platforms='{}'
          if [ "$WINDOWS_RESULT" = success ]; then
            installers=$(find builds/TasknBoard-windows-x64 -name '*-setup.exe')
            [ "$(echo "$installers" | wc -l)" -eq 1 ] || { echo "::error::Expected one installer: $installers"; exit 1; }
            cp "$installers" release/TasknBoard-windows-x64-setup.exe
            platforms=$(jq --arg signature "$(cat "$installers.sig")" --arg url "$base/TasknBoard-windows-x64-setup.exe" \
              '. + {"windows-x86_64": {signature: $signature, url: $url}}' <<< "$platforms")
          else
            echo "::warning::The Windows build did not succeed ($WINDOWS_RESULT). Publishing without it."
          fi
          if [ "$MACOS_RESULT" = success ]; then
            cp builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.zip release/
            cp builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.app.tar.gz release/
            platforms=$(jq --arg signature "$(cat builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.app.tar.gz.sig)" \
              --arg url "$base/TasknBoard-macos-arm64.app.tar.gz" \
              '. + {"darwin-aarch64": {signature: $signature, url: $url}}' <<< "$platforms")
          else
            echo "::warning::The macOS build did not succeed ($MACOS_RESULT). Publishing without it."
          fi
          ls -l release
          jq -n --arg version "$TASKNBOARD_VERSION" \
            --arg notes "Built from $GITHUB_SHA on main." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
      - name: Publish the latest release
        run: |
          sha="$GITHUB_SHA"
          notes="Built from $sha on main by run $GITHUB_RUN_NUMBER.

          - **Windows x64:** \`TasknBoard-windows-x64-setup.exe\`. The installer is unsigned, so Windows SmartScreen may ask before it runs.
          - **macOS (Apple Silicon, 13.5 or later):** \`TasknBoard-macos-arm64.zip\`. The app has an ad-hoc signature and is not notarized. After you unzip it, run \`xattr -dr com.apple.quarantine TasknBoard.app\` before the first launch.

          Installed apps check this release at launch and once a day, and offer to install a newer build."
          if gh api "repos/$GH_REPO/git/ref/tags/latest" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$sha" -F force=true --silent
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$sha" --silent
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest --title "Latest build" --notes "$notes" --latest
          else
            gh release create latest release/* --verify-tag --title "Latest build" --notes "$notes" --latest
          fi
          # The feed goes last, so it never points at files that are not uploaded yet.
          gh release upload latest latest.json --clobber
