name: Desktop apps

# Builds the Windows installer and the macOS app. A push to main also
# publishes both, and the signed update feed, to the `latest` release.
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-build']
    paths-ignore: ['**/*.md']

# A newer push replaces an older run, so `latest` never goes back in time.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The run number makes each build newer than the last, so the updater can compare them.
env:
  TASKNBOARD_VERSION: 0.1.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Check the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY. See the Automatic updates section in README.md."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/tauri*.json') }}
          restore-keys: |
            windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-rust-
      # PowerShell keeps the Windows tar.exe that desktop:prepare needs; Git Bash puts GNU tar first.
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'release.conf.json'
          @{ version = $env:TASKNBOARD_VERSION; bundle = @{ createUpdaterArtifacts = $true } } |
            ConvertTo-Json -Compress | Set-Content -Path $config -Encoding utf8NoBOM
          # A restored cache can hold installers from earlier versions.
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          # PowerShell removes a bare -- before it runs the npm.ps1 shim.
          npm run desktop:build:windows '--' --config $config
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test bundled service
        shell: pwsh
        run: |
          $env:TASKNBOARD_TEST_NODE = Join-Path $PWD 'src-tauri/resources/node.exe'
          $env:TASKNBOARD_TEST_SERVICE = Join-Path $PWD 'src-tauri/resources/server.mjs'
          node --test tests/desktop.test.mjs
      - name: Test browser workflows
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install and launch the app
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TasknBoard-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Check the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "::error::Missing repository secret TAURI_SIGNING_PRIVATE_KEY. See the Automatic updates section in README.md."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/target
          key: macos-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/tauri*.json') }}
          restore-keys: |
            macos-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            macos-rust-
      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          echo "{\"version\":\"$TASKNBOARD_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}" > "$RUNNER_TEMP/release.conf.json"
          # A restored cache can hold bundles from earlier versions.
          rm -rf src-tauri/target/release/bundle
          npm run desktop:build -- --config "$RUNNER_TEMP/release.conf.json"
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test bundled service
        run: |
          TASKNBOARD_TEST_NODE="$PWD/src-tauri/resources/node" \
          TASKNBOARD_TEST_SERVICE="$PWD/src-tauri/resources/server.mjs" \
          node --test tests/desktop.test.mjs
      # ditto keeps the bundle's symlinks and ad-hoc signature intact.
      # The updater installs the signed .app.tar.gz archive.
      - name: Zip the app
        run: |
          bundle=src-tauri/target/release/bundle/macos
          codesign --verify --deep --strict "$bundle/TasknBoard.app"
          mkdir macos-release
          ditto -c -k --sequesterRsrc --keepParent "$bundle/TasknBoard.app" macos-release/TasknBoard-macos-arm64.zip
          cp "$bundle/TasknBoard.app.tar.gz" macos-release/TasknBoard-macos-arm64.app.tar.gz
          cp "$bundle/TasknBoard.app.tar.gz.sig" macos-release/TasknBoard-macos-arm64.app.tar.gz.sig
      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TasknBoard-macos-arm64
          path: macos-release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download builds
        run: gh run download "$GITHUB_RUN_ID" --dir builds
      # Fixed names keep the releases/latest/download/<name> links stable.
      - name: Name release files
        run: |
          mkdir release
          installers=$(find builds/TasknBoard-windows-x64 -name '*-setup.exe')
          [ "$(echo "$installers" | wc -l)" -eq 1 ] || { echo "::error::Expected one installer: $installers"; exit 1; }
          cp "$installers" release/TasknBoard-windows-x64-setup.exe
          cp builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.zip release/
          cp builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.app.tar.gz release/
          ls -l release
          base="https://github.com/$GH_REPO/releases/download/latest"
          jq -n --arg version "$TASKNBOARD_VERSION" \
            --arg notes "Built from $GITHUB_SHA on main." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_signature "$(cat builds/TasknBoard-macos-arm64/TasknBoard-macos-arm64.app.tar.gz.sig)" \
            --arg windows_signature "$(cat "$installers.sig")" \
            --arg base "$base" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac_signature, url: "\($base)/TasknBoard-macos-arm64.app.tar.gz"},
              "windows-x86_64": {signature: $windows_signature, url: "\($base)/TasknBoard-windows-x64-setup.exe"}
            }}' > latest.json
          cat latest.json
      - name: Publish the latest release
        run: |
          sha="$GITHUB_SHA"
          notes="Built from $sha on main by run $GITHUB_RUN_NUMBER.

          - **Windows x64:** \`TasknBoard-windows-x64-setup.exe\`. The installer is unsigned, so Windows SmartScreen may ask before it runs.
          - **macOS (Apple Silicon, 13.5 or later):** \`TasknBoard-macos-arm64.zip\`. The app has an ad-hoc signature and is not notarized. After you unzip it, run \`xattr -dr com.apple.quarantine TasknBoard.app\` before the first launch.

          Installed apps check this release at launch and once a day, and offer to install a newer build."
          if gh api "repos/$GH_REPO/git/ref/tags/latest" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$sha" -F force=true --silent
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$sha" --silent
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/* --clobber
            gh release edit latest --title "Latest build" --notes "$notes" --latest
          else
            gh release create latest release/* --verify-tag --title "Latest build" --notes "$notes" --latest
          fi
          # The feed goes last, so it never points at files that are not uploaded yet.
          gh release upload latest latest.json --clobber
